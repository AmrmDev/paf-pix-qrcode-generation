name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas da mesma branch/PR quando chega um novo push
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Gradle + Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Cache de dependências e do wrapper do Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # O zip/Windows pode perder o bit de execução do gradlew
      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      # Compila o projeto e gera o JAR executável, sem rodar os testes (-x test)
      - name: Build (sem testes)
        run: ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pix-qrcode-generation-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
