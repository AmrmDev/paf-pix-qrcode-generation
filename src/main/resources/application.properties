spring.application.name=pix-qrcode-generation

# Logs: texto legivel com requestId e txid no MDC
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [req=%X{requestId:-}] [txid=%X{txid:-}] %logger{25} - %msg%n
logging.level.root=INFO
logging.level.com.paf.pix_qrcode_generation=INFO
# troque para DEBUG para ver o tempo de cada chamada ao DynamoDB
logging.level.com.paf.pix_qrcode_generation.repository=INFO